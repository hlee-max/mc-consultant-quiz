<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>MC コンサルタント 検定対策クイズ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
  .header { background: #fff; border-bottom: 1px solid #e0e0d8; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .header-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .score-badge { background: #f0f0ea; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: #444; }
  .container { max-width: 740px; margin: 0 auto; padding: 24px 16px; }
  .start-screen { text-align: center; padding: 40px 20px; }
  .start-screen h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .start-screen p { color: #666; font-size: 14px; margin-bottom: 32px; line-height: 1.7; }
  .start-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 32px; }
  .info-card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e0; padding: 16px 12px; text-align: center; }
  .info-card .val { font-size: 22px; font-weight: 700; color: #2563eb; }
  .info-card .lbl { font-size: 11px; color: #888; margin-top: 4px; }
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .section-btn { background: #fff; border: 1.5px solid #e0e0d8; border-radius: 10px; padding: 14px 16px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .section-btn:hover { border-color: #2563eb; background: #eff6ff; }
  .section-btn.active { border-color: #2563eb; background: #eff6ff; }
  .section-btn .s-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .section-btn .s-range { font-size: 12px; color: #888; margin-top: 3px; }
  .btn { display: inline-block; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #c7d7f8; cursor: default; }
  .btn-secondary { background: #fff; color: #444; border: 1px solid #d0d0c8; }
  .btn-secondary:hover { background: #f5f5f0; }
  .btn-full { width: 100%; }
  .progress-wrap { background: #e8e8e0; border-radius: 99px; height: 5px; margin-bottom: 6px; overflow: hidden; }
  .progress-fill { height: 5px; background: #2563eb; border-radius: 99px; transition: width 0.3s; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 20px; }
  .question-card { background: #fff; border-radius: 14px; border: 1px solid #e8e8e0; padding: 24px; margin-bottom: 16px; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .q-num { font-size: 12px; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 3px 10px; border-radius: 99px; }
  .q-multi { font-size: 11px; color: #b45309; background: #fef3c7; padding: 3px 10px; border-radius: 99px; }
  .q-theme { font-size: 11px; color: #6b7280; background: #f3f4f6; padding: 3px 10px; border-radius: 99px; }
  .q-importance { font-size: 11px; color: #7c3aed; background: #f5f3ff; padding: 3px 10px; border-radius: 99px; }
  .q-text { font-size: 15px; line-height: 1.75; color: #1a1a1a; }
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #e0e0d8; background: #fff; cursor: pointer; transition: all 0.12s; text-align: left; width: 100%; }
  .opt:hover:not(:disabled) { border-color: #2563eb; background: #f8faff; }
  .opt.selected { border-color: #2563eb; background: #eff6ff; }
  .opt.correct { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .opt.missed { border-color: #16a34a; background: #f0fdf4; opacity: 0.65; }
  .opt:disabled { cursor: default; }
  .opt-key { font-size: 13px; font-weight: 700; min-width: 22px; color: #666; flex-shrink: 0; padding-top: 1px; }
  .opt.selected .opt-key { color: #2563eb; }
  .opt.correct .opt-key { color: #16a34a; }
  .opt.wrong .opt-key { color: #dc2626; }
  .opt.missed .opt-key { color: #16a34a; }
  .opt-text { font-size: 14px; line-height: 1.65; color: #1a1a1a; }
  .explanation { margin-top: 16px; border-radius: 12px; overflow: hidden; border: 1px solid #e0e8ff; }
  .exp-section { padding: 14px 16px; border-bottom: 1px solid #e8eef8; }
  .exp-section:last-child { border-bottom: none; }
  .exp-section.reason { background: #f0f6ff; }
  .exp-section.wrong { background: #fff; }
  .exp-section.meta { background: #fafafa; display: flex; gap: 16px; flex-wrap: wrap; }
  .exp-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .exp-label.reason { color: #2563eb; }
  .exp-label.wrong { color: #dc2626; }
  .exp-text { font-size: 13px; line-height: 1.75; color: #374151; }
  .wrong-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .wrong-list li { font-size: 13px; line-height: 1.7; color: #374151; padding-left: 8px; border-left: 2px solid #fca5a5; }
  .wrong-list li strong { color: #dc2626; }
  .meta-item { display: flex; align-items: center; gap: 6px; }
  .meta-item .meta-label { font-size: 11px; color: #9ca3af; }
  .meta-item .meta-val { font-size: 13px; font-weight: 500; color: #374151; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
  .result-screen { text-align: center; padding: 20px 0; }
  .result-score { font-size: 64px; font-weight: 800; line-height: 1; }
  .result-score.great { color: #16a34a; }
  .result-score.good { color: #d97706; }
  .result-score.low { color: #dc2626; }
  .result-msg { font-size: 16px; color: #666; margin: 8px 0 24px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .result-card { background: #fff; border: 1px solid #e8e8e0; border-radius: 10px; padding: 16px 12px; }
  .result-card .rv { font-size: 24px; font-weight: 700; }
  .result-card .rl { font-size: 11px; color: #888; margin-top: 4px; }
  .rv-correct { color: #16a34a; }
  .rv-wrong { color: #dc2626; }
  .rv-total { color: #2563eb; }
  .review-title { font-size: 14px; font-weight: 600; text-align: left; margin-bottom: 12px; color: #1a1a1a; }
  .review-list { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .review-item { background: #fff; border: 1px solid #e8e8e0; border-radius: 10px; padding: 14px 16px; }
  .review-item.ok { border-left: 3px solid #16a34a; }
  .review-item.ng { border-left: 3px solid #dc2626; }
  .review-q-text { font-size: 12px; color: #666; margin-bottom: 8px; line-height: 1.5; }
  .review-answers { display: flex; gap: 8px; flex-wrap: wrap; }
  .ans-tag { font-size: 12px; padding: 3px 10px; border-radius: 99px; }
  .ans-tag.your-correct { background: #f0fdf4; color: #166534; }
  .ans-tag.your-wrong { background: #fef2f2; color: #991b1b; }
  .ans-tag.correct-ans { background: #eff6ff; color: #1e40af; }
  .result-btns { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  @media (max-width: 480px) {
    .section-grid { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: 1fr 1fr 1fr; }
    .container { padding: 16px 12px; }
  }
</style>
</head>

<script>
const ALL_QUESTIONS = [{"no": 1, "q": "Northern Trail Outfitters 社には SFTP アカウントに継続的にドロップされるファイルがあります。  このファイルがドロップされたらすぐインポートしてセグメント化し、 ファイル内のデータに応じて特定のジャーニーを開始できるようにしたいと考えています。  上記の要件を満たすオプションはどれですか？2 つ選択してください。", "opts": ["スケジュール済みオートメーション", "判断分岐", "SQL クエリ", "ファイルドロップオートメーション"], "answer": [2, 3], "exp": "ファイルドロップオートメーションは SFTP にファイルが置かれた瞬間に自動でオートメーションをトリガーします。SQL クエリはそのデータをセグメント化してジャーニー用 DE に格納するために使います。スケジュール済みは定時起動のため「すぐに」という要件を満たしません。", "multi": true, "exp_detail": {"reason": "ファイルドロップオートメーションは SFTP にファイルが配置された瞬間に自動でオートメーションをトリガーする機能です。スケジュール設定不要でファイルの到着を検知して即時起動できます。SQL クエリはファイルのデータを条件でセグメント化し、ジャーニーのエントリ用 DE に格納するために必要です。", "wrong_html": "<li><strong>A（スケジュール済みオートメーション…）</strong>：スケジュール済みオートメーションは指定した時刻に起動します。「ファイルがドロップされたらすぐ」という即時性の要件を満たせません。</li><li><strong>B（判断分岐…）</strong>：判断分岐はジャーニー内での条件分岐アクティビティです。オートメーションのトリガーやデータインポートとは無関係です。</li>", "importance": "★★★", "theme": "Automation Studio / ファイルドロップ自動化"}}, {"no": 2, "q": "Northern Trail Outfitters はメールテンプレートに「オンラインで表示」リンクを記載して、 ユーザーがメールの Web ページバージョンを表示できるようにしたいと考えています。  リンクに href 属性として含めるべきパーソナライズ文字列はどれですか？", "opts": ["%%view_email_url%%", "%%view_as_webpage%%", "%%vawp%%", "%%view_online%%"], "answer": [0], "exp": "Salesforce公式は、「Web版で表示（View as Web Page）」用のURLとして %%view_email_url%% をパーソナライズ文字列に掲載しています。", "multi": false, "exp_detail": {"reason": "%%view_email_url%% が Salesforce 公式ドキュメントで定義されている「Web ページとして表示」用の正式なパーソナライズ文字列です。送信時にそのメールの Web 版 URL に動的に置き換えられます。", "wrong_html": "<li><strong>B（%%view_as_webpage%%…）</strong>：%%view_as_webpage%% は混同されやすいですが、公式に定義された文字列ではなく機能しません。</li><li><strong>C（%%vawp%%…）</strong>：%%vawp%% も存在しない文字列です。VAWP は「View As Web Page」の略語として使われることがありますが、パーソナライズ文字列としては無効です。</li><li><strong>D（%%view_online%%…）</strong>：%%view_online%% も公式に定義された文字列ではありません。</li>", "importance": "★★★", "theme": "Email Studio / パーソナライズ文字列"}}, {"no": 3, "q": "Northern Trail Outfitters 社は Salesforce の取引先責任者レコードに クリック数が表示されていないことに気が付きました。  この考えられる原因はどれですか？2 つ選択してください。", "opts": ["同期データソースが 15 分おきにしかデータをプッシュしていない", "購読者キーに取引先責任者 ID が使用されている", "購読者キーに メールアドレスが使用されている", "Marketing Cloud Connector 設定で「個別レベルのトラッキング」が選択されていなかった"], "answer": [2, 3], "exp": "MCConnect でトラッキングデータを CRM に返すには「個別レベルのトラッキング」設定が必要です。また購読者キーにメールアドレスを使うと CRM の取引先責任者 ID と一致しないため、クリックデータが正しく紐付けられません。ContactID を購読者キーにすれば正しくマッピングされます。", "multi": true, "exp_detail": {"reason": "MCConnect でトラッキングデータを CRM の取引先責任者レコードに返すには①購読者キーに CRM の ContactID を使うこと、②MCConnect 設定で「個別レベルのトラッキング」を有効にすることの両方が必要です。どちらか一方が欠けてもクリックデータが表示されません。", "wrong_html": "<li><strong>A（同期データソースが 15 分おきにしかデ…）</strong>：同期データソースの 15 分間隔はデータの同期頻度の話です。クリック数が「表示されない」原因にはなりません（遅延するだけ）。</li><li><strong>B（購読者キーに取引先責任者 ID が使用さ…）</strong>：購読者キーに ContactID を使うことは正しい設定です。ContactID を使えばクリックデータが正しく紐付けられます。これは誤りの原因ではありません。</li>", "importance": "★★★", "theme": "Marketing Cloud Connect / トラッキング"}}, {"no": 4, "q": "Northern Trail Outfitters (NTO) は、データエクステンションから日次送信キャンペーンの対象として 適切なオーディエンスを作成したいと考えています。  このオーディエンスは日々変化します。 これらのメールには「Web ページとして表示」リンクが記載されていますが、 NTO ではオーディエンスが毎回更新される際に、このリンクが破壊することがないようにしたいと考えています。  この要件を満たすのに適した構成は次のうちどれですか？", "opts": ["送信ロギングデータエクステンションから情報を取り込む AMPScript をメールに使用し、メッセージのコンテキストに基づいて表示するコンテンツを決定する", "SQL クエリを使用してオーディエンスを絞り込み、新しいデータエクステンションに日次で追加と更新を行う", "メールを送信済みの利用者を除外する、送信除外リストを使用する", "SQL クエリを使用してオーディエンスを絞り込み、新しいデータエクステンションに毎日上書きする"], "answer": [1], "exp": "「Webページとして表示（VAWP）」リンクは、送信時の“元データ”に依存します。 Salesforce公式は、送信に使ったデータエクステンション（DE）を削除・上書きすると VAWP が壊れる可能性を明記しています。  A：AMPScript＋送信ログ参照は“保険”にはなり得ますが（送信時の動的値をログ化しておけば効果）、要件に対して過剰実装。まずはBで十分です。", "multi": false, "exp_detail": {"reason": "VAWP（Web ページとして表示）リンクは送信時に使用した DE のデータに依存します。アップサート（Upsert）は既存レコードを保持しながら新規追加・更新するため、送信済みレコードのデータが残り VAWP リンクが壊れません。", "wrong_html": "<li><strong>A（送信ロギングデータエクステンションから情…）</strong>：AMPScript で送信ログを参照する方法は技術的に可能ですが、VAWP 破損の根本解決にはなりません。要件に対して過剰実装であり、シンプルな B が優先されます。</li><li><strong>C（メールを送信済みの利用者を除外する、送信…）</strong>：除外リストは「送信済みの人を除く」機能で、VAWP リンクの保護とは無関係です。</li><li><strong>D（SQL クエリを使用してオーディエンスを…）</strong>：上書き（Overwrite）は DE のデータを毎日全削除して再作成します。送信済みレコードが消えるため VAWP リンクが壊れます。これが問題の原因となる設定です。</li>", "importance": "★★★", "theme": "Data Extension / VAWP / SQL クエリ"}}, {"no": 5, "q": "Northern Trail Outfitters は、返信メール管理（RMM）によってキャプチャされたマーケティングメールへの返信の本文、 カスタマーサービスチームに自動転送されるメッセージに含めたいと考えています。  この目的を達成するにはどうすればよいですか？", "opts": ["RMM データビューで返信の本文を照会し、データエクステンションにあるその本文を参照する", "RMM の動的コンテンツブロックを使用して、メールへの返信の本文を表示する", "RMM 設定の「返信を添付ファイルとして含める」チェックボックスをオンにする", "RMM のパーソナライズ文字列を使用して、メールへの返信の本文を表示する"], "answer": [3], "exp": "RMM では返信本文をパーソナライズ文字列として参照できます。これを自動転送メールに埋め込むことで、カスタマーサービスチームが返信内容を確認できます。動的コンテンツブロックや RMM データビューはこの用途には対応していません。", "multi": false, "exp_detail": {"reason": "RMM（返信メール管理）では返信本文をパーソナライズ文字列として参照できます。自動転送メールにこの文字列を埋め込むことで、カスタマーサービスチームが返信内容をメール本文で確認できます。", "wrong_html": "<li><strong>A（RMM データビューで返信の本文を照会し…）</strong>：RMM データビューは返信データの照会に使えますが、自動転送メールに本文を含める機能ではありません。別途複雑な実装が必要になります。</li><li><strong>B（RMM の動的コンテンツブロックを使用し…）</strong>：RMM に動的コンテンツブロックという機能は存在しません。</li><li><strong>C（RMM 設定の「返信を添付ファイルとして…）</strong>：「返信を添付ファイルとして含める」は元の返信メールをファイル添付する機能で、本文をメール内に表示する用途とは異なります。</li>", "importance": "★★", "theme": "RMM（返信メール管理）"}}, {"no": 6, "q": "Northern Trail Outfitters は今日、ある顧客から先週購読取り消ししたのにメールが届いたという苦情を受けました。  今回のメールは Marketing Cloud Connect (MCC) を使用して送信されたものですが、 先週のメールは外部システムが Marketing Cloud SFTP にファイルドロップし、 オートメーションによって送信定義メールがトリガーされたときに送信されたものです。  この顧客が MCC 経由でメールを受信した理由として考えられるのはどれですか？", "opts": ["以降の送信では、メールアドレスが登録者キーとして使用されていた", "「メール送信除外」が更新されるのは、送信元が Salesforce である場合のみである", "以降の送信のユーザーに、Salesforce の編集権限が必要であった", "「メール送信除外」項目を取引先責任者ページレイアウトに追加する必要がある"], "answer": [0], "exp": "先週の送信でメールアドレスを購読者キーとして使っていた場合、オプトアウト情報はそのメールアドレス紐付きで記録されます。MCC 送信では CRM の連絡先 ID が購読者キーとなるため、異なる購読者キーとして扱われオプトアウトが反映されません。", "multi": false, "exp_detail": {"reason": "購読者キーにメールアドレスを使っていた場合、オプトアウト情報は「そのメールアドレスに対する購読者キー」として記録されます。MCConnect 送信では ContactID が購読者キーとして使われるため、同じ人でも別々の購読者として扱われ、オプトアウトが引き継がれません。", "wrong_html": "<li><strong>B（「メール送信除外」が更新されるのは、送信…）</strong>：「メール送信除外」は MCConnect 経由・非 MCConnect どちらの送信でも反映されます。送信元が Salesforce かどうかは関係ありま       else if (!isCorrect && wasSelected) cls += " wrong";
      else if (isCorrect && !wasSelected) cls += " missed";
    } else { if (state.selected.includes(i)) cls += " selected"; }
    return `<button class="${cls}" onclick="toggleOpt(${i})" ${isSubmitted ? "disabled" : ""}>
      <span class="opt-key">${getKey(i)}.</span><span class="opt-text">${opt}</span></button>`;
  }).join("");
  let expHtml = "";
  if (isSubmitted) {
    const d = q.exp_detail;
    if (d) {
      expHtml = `<div class="explanation">
        <div class="exp-section reason">
          <div class="exp-label reason">✓ 正解の理由</div>
          <div class="exp-text">${d.reason}</div>
        </div>
        <div class="exp-section wrong">
          <div class="exp-label wrong">✗ 他の選択肢がなぜ違うか</div>
          <ul class="wrong-list">${d.wrong_html}</ul>
        </div>
        <div class="exp-section meta">
          <div class="meta-item"><span class="meta-label">重要度</span><span class="meta-val">${d.importance}</span></div>
          <div class="meta-item"><span class="meta-label">テーマ</span><span class="meta-val">${d.theme}</span></div>
        </div>
      </div>`;
    } else {
      expHtml = `<div class="explanation"><div class="exp-section reason">
        <div class="exp-label reason">解説</div>
        <div class="exp-text">${q.exp || "公式ドキュメントを参照してください。"}</div>
      </div></div>`;
    }
  }
  const d = q.exp_detail;
  app.innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>問 ${state.current + 1} / ${state.questions.length}</span><span>${pct}% 完了</span></div>
    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">問 ${q.no}</span>
        ${q.multi ? '<span class="q-multi">2つ選択</span>' : ""}
        ${d ? `<span class="q-theme">${d.theme}</span>` : ""}
        ${d ? `<span class="q-importance">${d.importance}</span>` : ""}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHtml}</div>
      ${expHtml}
    </div>
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="prevQ()" ${state.current === 0 ? "disabled" : ""}>← 前へ</button>
      ${!isSubmitted
        ? `<button class="btn btn-primary" onclick="submitQ()" ${state.selected.length === 0 ? "disabled" : ""}>回答する</button>`
        : state.current < state.questions.length - 1
          ? `<button class="btn btn-primary" onclick="nextQ()">次の問題 →</button>`
          : `<button class="btn btn-primary" onclick="showResult()">結果を見る</button>`
      }
    </div>`;
}
function toggleOpt(i) {
  if (state.submitted[state.current] !== undefined) return;
  const q = state.questions[state.current];
  if (q.multi) {
    if (state.selected.includes(i)) state.selected = state.selected.filter(x => x !== i);
    else if (state.selected.length < q.answer.length) state.selected.push(i);
  } else { state.selected = [i]; }
  render();
}
function submitQ() { state.submitted[state.current] = [...state.selected]; render(); }
function nextQ() { state.current++; state.selected = state.submitted[state.current] ? [...state.submitted[state.current]] : []; render(); }
function prevQ() { if (state.current > 0) { state.current--; state.selected = state.submitted[state.current] ? [...state.submitted[state.current]] : []; render(); } }
function showResult() { state.screen = "result"; render(); }
function renderResult(app) {
  const total = state.questions.length;
  let correct = 0;
  state.questions.forEach((q, i) => {
    const ans = state.submitted[i] || [];
    if (JSON.stringify([...ans].sort()) === JSON.stringify([...q.answer].sort())) correct++;
  });
  const pct = Math.round((correct / total) * 100);
  const scoreClass = pct >= 80 ? "great" : pct >= 67 ? "good" : "low";
  const msg = pct >= 80 ? "素晴らしい！合格圏内です 🎉" : pct >= 67 ? "合格ライン付近です。もう少し！" : "復習して再挑戦しましょう";
  let reviewHtml = state.questions.map((q, i) => {
    const ans = state.submitted[i] || [];
    const ok = JSON.stringify([...ans].sort()) === JSON.stringify([...q.answer].sort());
    const yourKeys = ans.map(x => getKey(x)).join(", ") || "未回答";
    const correctKeys = q.answer.map(x => getKey(x)).join(", ");
    return `<div class="review-item ${ok ? "ok" : "ng"}">
      <div class="review-q-text">問${q.no}. ${q.q.slice(0, 55)}…</div>
      <div class="review-answers">
        <span class="ans-tag ${ok ? "your-correct" : "your-wrong"}">あなた: ${yourKeys}</span>
        ${!ok ? `<span class="ans-tag correct-ans">正解: ${correctKeys}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  app.innerHTML = `
    <div class="result-screen">
      <div class="result-score ${scoreClass}">${pct}<span style="font-size:28px">点</span></div>
      <div class="result-msg">${correct} / ${total} 問正解　${msg}</div>
      <div class="result-grid">
        <div class="result-card"><div class="rv rv-correct">${correct}</div><div class="rl">正解</div></div>
        <div class="result-card"><div class="rv rv-wrong">${total - correct}</div><div class="rl">不正解</div></div>
        <div class="result-card"><div class="rv rv-total">${total}</div><div class="rl">合計</div></div>
      </div>
      <div class="review-title">問題ごとの結果</div>
      <div class="review-list">${reviewHtml}</div>
      <div class="result-btns">
        <button class="btn btn-secondary" onclick="retryQuiz()">やり直す</button>
        <button class="btn btn-primary" onclick="backToStart()">セクション選択へ</button>
      </div>
    </div>`;
}
function retryQuiz() { state.current = 0; state.selected = []; state.submitted = new Array(state.questions.length).fill(undefined); state.screen = "quiz"; render(); }
function backToStart() { state.screen = "start"; state.selectedSection = null; render(); }
render();
</script>
</body>
</html>
