<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC コンサルタント 検定対策クイズ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }

  /* ヘッダー */
  .header { background: #fff; border-bottom: 1px solid #e0e0d8; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .header-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .score-badge { background: #f0f0ea; border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: #444; }

  /* メイン */
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }

  /* スタート画面 */
  .start-screen { text-align: center; padding: 40px 20px; }
  .start-screen h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .start-screen p { color: #666; font-size: 14px; margin-bottom: 32px; line-height: 1.7; }
  .start-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 32px; }
  .info-card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e0; padding: 16px 12px; text-align: center; }
  .info-card .val { font-size: 22px; font-weight: 700; color: #2563eb; }
  .info-card .lbl { font-size: 11px; color: #888; margin-top: 4px; }

  /* セクション選択 */
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .section-btn { background: #fff; border: 1.5px solid #e0e0d8; border-radius: 10px; padding: 14px 16px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .section-btn:hover { border-color: #2563eb; background: #eff6ff; }
  .section-btn.active { border-color: #2563eb; background: #eff6ff; }
  .section-btn .s-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .section-btn .s-range { font-size: 12px; color: #888; margin-top: 3px; }

  /* ボタン */
  .btn { display: inline-block; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #c7d7f8; cursor: default; }
  .btn-secondary { background: #fff; color: #444; border: 1px solid #d0d0c8; }
  .btn-secondary:hover { background: #f5f5f0; }
  .btn-full { width: 100%; }

  /* プログレス */
  .progress-wrap { background: #e8e8e0; border-radius: 99px; height: 5px; margin-bottom: 6px; overflow: hidden; }
  .progress-fill { height: 5px; background: #2563eb; border-radius: 99px; transition: width 0.3s; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 20px; }

  /* 問題カード */
  .question-card { background: #fff; border-radius: 14px; border: 1px solid #e8e8e0; padding: 24px; margin-bottom: 16px; }
  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .q-num { font-size: 12px; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 3px 10px; border-radius: 99px; }
  .q-multi { font-size: 11px; color: #b45309; background: #fef3c7; padding: 3px 10px; border-radius: 99px; }
  .q-text { font-size: 15px; line-height: 1.75; color: #1a1a1a; }

  /* 選択肢 */
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #e0e0d8; background: #fff; cursor: pointer; transition: all 0.12s; text-align: left; width: 100%; }
  .opt:hover:not(:disabled) { border-color: #2563eb; background: #f8faff; }
  .opt.selected { border-color: #2563eb; background: #eff6ff; }
  .opt.correct { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .opt.missed { border-color: #16a34a; background: #f0fdf4; opacity: 0.6; }
  .opt:disabled { cursor: default; }
  .opt-key { font-size: 13px; font-weight: 700; min-width: 22px; color: #666; flex-shrink: 0; padding-top: 1px; }
  .opt.selected .opt-key { color: #2563eb; }
  .opt.correct .opt-key { color: #16a34a; }
  .opt.wrong .opt-key { color: #dc2626; }
  .opt.missed .opt-key { color: #16a34a; }
  .opt-text { font-size: 14px; line-height: 1.65; color: #1a1a1a; }

  /* 解説 */
  .explanation { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: #f8f9fa; border-left: 3px solid #2563eb; }
  .exp-label { font-size: 11px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .exp-text { font-size: 13px; line-height: 1.7; color: #444; }

  /* ナビゲーション */
  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }

  /* 結果画面 */
  .result-screen { text-align: center; padding: 20px 0; }
  .result-score { font-size: 64px; font-weight: 800; line-height: 1; }
  .result-score.great { color: #16a34a; }
  .result-score.good { color: #d97706; }
  .result-score.low { color: #dc2626; }
  .result-msg { font-size: 16px; color: #666; margin: 8px 0 24px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .result-card { background: #fff; border: 1px solid #e8e8e0; border-radius: 10px; padding: 16px 12px; }
  .result-card .rv { font-size: 24px; font-weight: 700; }
  .result-card .rl { font-size: 11px; color: #888; margin-top: 4px; }
  .rv-correct { color: #16a34a; }
  .rv-wrong { color: #dc2626; }
  .rv-total { color: #2563eb; }

  /* 問題別レビュー */
  .review-title { font-size: 14px; font-weight: 600; text-align: left; margin-bottom: 12px; color: #1a1a1a; }
  .review-list { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .review-item { background: #fff; border: 1px solid #e8e8e0; border-radius: 10px; padding: 14px 16px; }
  .review-item.ok { border-left: 3px solid #16a34a; }
  .review-item.ng { border-left: 3px solid #dc2626; }
  .review-q-text { font-size: 12px; color: #666; margin-bottom: 8px; line-height: 1.5; }
  .review-answers { display: flex; gap: 8px; flex-wrap: wrap; }
  .ans-tag { font-size: 12px; padding: 3px 10px; border-radius: 99px; }
  .ans-tag.your-correct { background: #f0fdf4; color: #166534; }
  .ans-tag.your-wrong { background: #fef2f2; color: #991b1b; }
  .ans-tag.correct-ans { background: #eff6ff; color: #1e40af; }

  .result-btns { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }

  @media (max-width: 480px) {
    .start-info { grid-template-columns: 1fr 1fr 1fr; }
    .section-grid { grid-template-columns: 1fr; }
    .result-grid { grid-template-columns: 1fr 1fr 1fr; }
    .container { padding: 16px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">MC コンサルタント 検定対策</div>
    <div class="header-sub">Marketing Cloud Engagement Consultant</div>
  </div>
  <div class="score-badge" id="header-score">0 / 0</div>
</div>

<div class="container" id="app"></div>

<script>
const ALL_QUESTIONS = [{"no": 1, "q": "Northern Trail Outfitters 社には SFTP アカウントに継続的にドロップされるファイルがあります。  このファイルがドロップされたらすぐインポートしてセグメント化し、 ファイル内のデータに応じて特定のジャーニーを開始できるようにしたいと考えています。  上記の要件を満たすオプションはどれですか？2 つ選択してください。", "opts": ["スケジュール済みオートメーション", "判断分岐", "SQL クエリ", "ファイルドロップオートメーション"], "answer": [2, 3], "exp": "A File Drop Automation can be used to trigger an automation when a file is uploaded to the Marketing Cloud FTP. A SQL Query can be used to segment the audience based on the data inside the file and populate a data extension for each segment. The data extensions can then be used as entry sources for different journeys.", "multi": true}, {"no": 2, "q": "Northern Trail Outfitters はメールテンプレートに「オンラインで表示」リンクを記載して、 ユーザーがメールの Web ページバージョンを表示できるようにしたいと考えています。  リンクに href 属性として含めるべきパーソナライズ文字列はどれですか？", "opts": ["%%view_email_url%%", "%%view_as_webpage%%", "%%vawp%%", "%%view_online%%"], "answer": [0], "exp": "Salesforce公式は、「Web版で表示（View as Web Page）」用のURLとして %%view_email_url%% をパーソナライズ文字列に掲載しています。", "multi": false}, {"no": 3, "q": "Northern Trail Outfitters 社は Salesforce の取引先責任者レコードに クリック数が表示されていないことに気が付きました。  この考えられる原因はどれですか？2 つ選択してください。", "opts": ["同期データソースが 15 分おきにしかデータをプッシュしていない", "購読者キーに取引先責任者 ID が使用されている", "購読者キーに メールアドレスが使用されている", "Marketing Cloud Connector 設定で「個別レベルのトラッキング」が選択されていなかった"], "answer": [2, 3], "exp": "MCConnect でトラッキングデータを CRM に返すには「個別レベルのトラッキング」設定が必要です。また購読者キーにメールアドレスを使うと CRM の取引先責任者 ID と一致しないため、クリックデータが正しく紐付けられません。ContactID を購読者キーにすれば正しくマッピングされます。", "multi": true}, {"no": 4, "q": "Northern Trail Outfitters (NTO) は、データエクステンションから日次送信キャンペーンの対象として 適切なオーディエンスを作成したいと考えています。  このオーディエンスは日々変化します。 これらのメールには「Web ページとして表示」リンクが記載されていますが、 NTO ではオーディエンスが毎回更新される際に、このリンクが破壊することがないようにしたいと考えています。  この要件を満たすのに適した構成は次のうちどれですか？", "opts": ["送信ロギングデータエクステンションから情報を取り込む AMPScript をメールに使用し、メッセージのコンテキストに基づいて表示するコンテンツを決定する", "SQL クエリを使用してオーディエンスを絞り込み、新しいデータエクステンションに日次で追加と更新を行う", "メールを送信済みの利用者を除外する、送信除外リストを使用する", "SQL クエリを使用してオーディエンスを絞り込み、新しいデータエクステンションに毎日上書きする"], "answer": [1], "exp": "「Webページとして表示（VAWP）」リンクは、送信時の“元データ”に依存します。 Salesforce公式は、送信に使ったデータエクステンション（DE）を削除・上書きすると VAWP が壊れる可能性を明記しています。  A：AMPScript＋送信ログ参照は“保険”にはなり得ますが（送信時の動的値をログ化しておけば効果）、要件に対して過剰実装。まずはBで十分です。", "multi": false}, {"no": 5, "q": "Northern Trail Outfitters は、返信メール管理（RMM）によってキャプチャされたマーケティングメールへの返信の本文、 カスタマーサービスチームに自動転送されるメッセージに含めたいと考えています。  この目的を達成するにはどうすればよいですか？", "opts": ["RMM データビューで返信の本文を照会し、データエクステンションにあるその本文を参照する", "RMM の動的コンテンツブロックを使用して、メールへの返信の本文を表示する", "RMM 設定の「返信を添付ファイルとして含める」チェックボックスをオンにする", "RMM のパーソナライズ文字列を使用して、メールへの返信の本文を表示する"], "answer": [3], "exp": "RMM では返信本文をパーソナライズ文字列として参照できます。これを自動転送メールに埋め込むことで、カスタマーサービスチームが返信内容を確認できます。動的コンテンツブロックや RMM データビューはこの用途には対応していません。", "multi": false}, {"no": 6, "q": "Northern Trail Outfitters は今日、ある顧客から先週購読取り消ししたのにメールが届いたという苦情を受けました。  今回のメールは Marketing Cloud Connect (MCC) を使用して送信されたものですが、 先週のメールは外部システムが Marketing Cloud SFTP にファイルドロップし、 オートメーションによって送信定義メールがトリガーされたときに送信されたものです。  この顧客が MCC 経由でメールを受信した理由として考えられるのはどれですか？", "opts": ["以降の送信では、メールアドレスが登録者キーとして使用されていた", "「メール送信除外」が更新されるのは、送信元が Salesforce である場合のみである", "以降の送信のユーザーに、Salesforce の編集権限が必要であった", "「メール送信除外」項目を取引先責任者ページレイアウトに追加する必要がある"], "answer": [0], "exp": "先週の送信でメールアドレスを購読者キーとして使っていた場合、オプトアウト情報はそのメールアドレス紐付きで記録されます。MCC 送信では CRM の連絡先 ID が購読者キーとなるため、異なる購読者キーとして扱われオプトアウトが反映されません。", "multi": false}, {"no": 7, "q": "Northern Trail Outfitters (NTO) では、NTO 用品やアウトドア体験を紹介する目的で、 アウトドア活動の著名なインフルエンサーのブログを管理しています。  また、週刊ニュースレターをメール配信しており、最新のブログエントリへのリンクをニュースレターに記載したいと考えています。  送信時に RSS フィードを取り込むことができるソリューションはどれですか？2 つ選択してください。", "opts": ["動的コンテンツ", "AMPScript", "パーソナライズ文字列", "外部コンテンツ"], "answer": [1, 3], "exp": "AMPScript の HTTPGet/TreatAsContent 関数を使うことで RSS フィードを取得・解析してメールに動的に表示できます。外部コンテンツブロックも送信時に外部 URL のコンテンツを取り込む機能で RSS に対応しています。動的コンテンツは購読者属性によるコンテンツ切り替えで RSS には対応しません。", "multi": true}, {"no": 8, "q": "Northern Trail Outfitters 社には「Fav_animals」というデータエクステンションがあり、 「SubscriberKey」フィールドと、登録者の好きな動物を保存する「Animal」フィールドが設定されています。  そして、Lookup AMPscript 関数を使用して、Salesforce レポートを対象オーディエンスとする 取引先責任者宛のメールに、各人の好きな動物を挿入したいと考えています。  送信時にルックアップを実行するためのパーソナライズ文字列を使用する正しいコードサンプルはどれですか？", "opts": ["Lookup(\"Fav_Animals\", \"Animal\", \"SubscriberKey\", emailaddr)", "Lookup(\"Fav_Animals\", \"Animal\", \"SubscriberKey\", ContactID)", "Lookup(\"Fav_Animals\", \"Animal\", \"SubscriberKey\", _subscriberKey)", "Lookup(\"Fav_Animals\", \"Animal\", \"SubscriberKey\", SubscriberKey)"], "answer": [2], "exp": "_subscriberKey はシステム変数で、送信時の購読者キー（Salesforce 送信時は ContactID）を動的に参照します。emailaddr はメールアドレス固定のため MCConnect 環境では不一致になります。SubscriberKey（大文字）は変数ではなく文字列リテラルとして扱われます。", "multi": false}, {"no": 9, "q": "ある不動産業者は、Salesforce CRM のニュースレターキャンペーンに追加されたすべての新規取引先責任者に、 物件リストを記載した週刊のニュースレターを送信したいと考えています。  このジャーニーは、物件リスト付きの最初のメッセージと、 このコンテンツエンゲージした人々へのフォローアップで構成されます。  どの物件が取引先責任者に適合するかに関するルールは、その取引責任者の所有者として割り当てられている仲介担当者、 その取引責任者に対応した可能性のある他の仲介担当者、物件に対するその取引責任者の関心に左右されます。  このデータモデルは、取引責任者 > 個人取引先 > 仲介担当者 > 物件の各オブジェクト間でリレーションがあり、 このすべてが CRM で使用され、Marketing Cloud に同期されています。  この処理を効率的に行うために推奨すべきソリューションはどれですか？", "opts": ["Salesforce CRM の送信と Salesforce レポートを使用して、パーソナライズデータを準備する", "Automation Studio と、キャンペーンをオーディエンスとするSalesforce 送信を使用する", "Salesforce データイベントを使用して、ジャーニーを開始し、メール内のパーソナライズロジックのスクリプトを記述する", "Automation Studio を使用して、パーソナライズデータで準備しジャーニーを開始する"], "answer": [3], "exp": "複数オブジェクト間の複雑なリレーションデータを扱う場合、Automation Studio で SQL クエリを使ってパーソナライズ用 DE を事前に準備するのがベストプラクティスです。その後 Journey Builder のエントリソースとして DE を使用します。Salesforce データイベントはリアルタイムトリガーに向いていますが、複雑な結合処理には不向きです。", "multi": false}, {"no": 10, "q": "分析チームは、メッセージの性質に伴う法務義務を確実に果たすために、 Transactional メールの状況（特に Sent と NotSent）に関する情報をリアルタイムで取得したいと考えています。  このシナリオで推奨すべき方法はどれですか？", "opts": ["各送信のデータビューをエクスポートする", "イベント通知サービス", "Sent オブジェクトのデータを取得する", "プラットフォームイベント API"], "answer": [1], "exp": "イベント通知サービス（ENS）はリアルタイムでイベント（送信・未送信・バウンスなど）を外部システムに通知する仕組みです。データビューは定期クエリが必要でリアルタイム性がなく、トランザクションメールの法務要件には ENS が最適です。", "multi": false}, {"no": 11, "q": "地域のサプライヤ会議を開催予定の Northern Trail Outfitters 社では、 参加が確定する場合にはイベント独自の安全に関する通知、スケジュールや会議室の変更、 予定外のポップアップセッションに関する情報を  ["連絡禁止リストを作成する SQL クエリを午前12 時 30 分に実行する", "ジャーニーの SMS アクティビティで送信ブロックアウト期間を構成する", "購読者のジャーニーを終了するジャーニーの目標を作成する", "連絡禁止リストを作成するインポート定義を午前 12 時に実行する"], "answer": [1], "exp": "Journey Builder の SMS アクティビティには送信ブロックアウト期間（Quiet Time）の設定機能があります。特定の時間帯（午前 1 時〜6 時）に送信対象になった場合、時間外として送信を保留または破棄できます。連絡禁止リストは別の用途で、この要件には適しません。", "multi": false}, {"no": 54, "q": "ある小規模なレストランフランチャイズは、 フランチャイズオーナーをサポートするために Marketing Cloud を導入したいと考えています。  マーケティングメッセージと購読者リストはフランチャイズの本社が所有し、 フランチャイズレストランのオーナーが、カスタマイズされたローカルメッセージをマーケティングキャンペーンに追加します。  どのような階層を推奨すべきですか？", "opts": ["共有フォルダーを構成したビジネスユニット1つ", "ビジネスユニット1つ", "親ビジネスユニット1つ、フランチャイズオーナー間で共有するための子ビジネスユニット1つ", "親ビジネスユニット1つ、各フランチャイズオーナーに子ビジネスユニット1つずつ"], "answer": [3], "exp": "フランチャイズ本部がコンテンツと購読者リストを管理し、各フランチャイズオーナーがローカルメッセージを追加する構成には、親 BU 1 つ＋各フランチャイズオーナーに子 BU 1 つずつの階層が最適です。これにより権限分離とコンテンツ共有が両立できます。", "multi": false}, {"no": 55, "q": "Northern Trail Outfitters 社は、Sales Cloud ユーザーが Email Studio で送信フローで送信対象にできる リードと取引先責任者の両方のレコードのセグメントを手動で作成できるようにしたいと考えています。  コンサルタントはセグメンテーションに何を推奨すべきですか？", "opts": ["Automation Studio", "Salesforce データエクステンション", "Salesforce レポート", "同期対象データエクステンション"], "answer": [2], "exp": "Sales Cloud ユーザーが Email Studio の送信フローでリードと取引先責任者の両方を手動でセグメント化するには Salesforce レポートが適しています。Salesforce レポートはリードと取引先責任者の両オブジェクトを対象にでき、Sales Cloud ユーザーが直接操作できます。", "multi": false}, {"no": 56, "q": "Northern Trail Outfitters 社 (NTO) はお知らせメールを実装したいと考えています。 新しい購読者が Web サイトでサインアップしたら、すぐにメールが届くようにします。 NTO は Marketing Cloud Connect を使用して、Sales Cloud と Marketing Cloud を接続しています。  どのソリューションで新しい購読者を獲得すべきですか？", "opts": ["データエクステンションへのファイルのインポート", "SFTP にドロップされるバッチファイル", "Web サイトから Sales Cloud への Web-to-リードフォーム", "Web サイトの Smart Capture フォーム"], "answer": [3], "exp": "MCConnect 環境でウェブサイトのサインアップをリアルタイムに MC と連携するには Smart Capture フォームが最適です。Smart Capture は MC の CloudPages 上に作成でき、フォーム送信と同時にサブスクライバーとして登録されます。SFTP バッチやファイルインポートは即時性がありません。", "multi": false}, {"no": 57, "q": "Northern Trail Outfitters は、marketing@email.nto.com という送信者アドレスを使用して送信したいと考えています。 返信は自動的に customerservice@nto.com に転送します。 また、顧客のメールアドレスへの自動返信には customer@example.com を含める予定です。  顧客への自動返信で送信者アドレスとして表示されるメールアドレスはどれですか？", "opts": ["reply@marketingcloud.com", "customer@example.com", "customerservice@nto.com", "marketing@email.nto.com"], "answer": [1], "exp": "Reply Mail Management（RMM）の自動返信は、設定したEmail Reply Addressを“From（送信者アドレス）”として用います。Trailheadにも「RMM が送る返信の From 情報には Email Reply Address が使われる」と記載があります。  一方、customerservice@nto.com のような“Routing/Forwarding address”は、ルールに合致しない返信の転送先であり、自動返信のFromにはなりません。", "multi": false}, {"no": 58, "q": "Northern Trail Outfitters 社では新規顧客のオンボーディングジャーニーの一環として、 メールと一緒に SMS とプッシュ通知も送信したいと考えています。  各購読者の一意の識別子として、コンサルタントは何を推奨すべきですか？", "opts": ["連絡先キーの住所のような一般的なフィールド", "連絡先キーのメールアドレス", "連絡先キーの電話番号などの数値フィールド", "連絡先キーの GUID または他に生成された ID"], "answer": [3], "exp": "クロスチャネル（メール・SMS・Push）での一意の識別子には GUID または生成された ID が推奨されます。メールアドレスや電話番号はチャネル固有の識別子であり、チャネルが変わると紐付けが壊れます。GUID を使うことで全チャネルで一貫した顧客追跡が可能になります。", "multi": false}, {"no": 59, "q": "Northern Trail Outfitters のアカウントには、2 つの Salesforce CRM アカウントを活用する Multi-Org が設定されています。 傘下のブランドである CloudKicks のビジネスユニットで、 Sandbox インスタンスへの接続を切断し、本番インスタンスに接続したいと考えています。  どのような追加の設定変更を行うべきですか？", "opts": ["既存のユーザーの対応付け、属性の対応付け、購読のトラッキングを削除する", "[セットアップ]で、2 つの本番インスタンスで構成される Multi-Org を設定する", "同期済みデータエクステンションを参照するクリアアクティビティを更新する", "接続する前に Sandbox 同期済みデータエクステンションの名前を変更して削除する"], "answer": [2], "exp": "Sandbox からの切断時、Marketing Cloud の Synchronized Data Sources は、同期済みデータエクステンション（SDE）や属性グループを自動で削除します。  そのため、SDE を参照しているクエリアクティビティは参照切れになります。Salesforce は、別 org に再接続した後は、SDE を参照するクエリアクティビティを更新するよう明言しています。", "multi": false}, {"no": 60, "q": "ある顧客が、過去6ヶ月以内に送信された何らかのメールのリンクをクリックした購読者をすべて特定し、 ロイヤルティプログラムを作成したいと考えています。  何を推奨すべきですか？", "opts": ["「購読者エンゲージメント」レポートを作成して実行する", "トラッキングの抽出を作成して実行する", "_Click データビューに対するデータフィルターを作成して実行する", "_Click データビューに対する SQL クエリを作成して実行する"], "answer": [3], "exp": "_Click データビューに対して SQL クエリを実行することで、過去 6 ヶ月のクリックデータを柔軟に抽出・集計できます。データフィルターは条件が固定で複雑なクエリに対応できず、トラッキング抽出はファイル出力でリスト作成には向きません。", "multi": false}];

const SECTIONS = [
  { label: "第1回", range: [0, 10], desc: "問1〜10" },
  { label: "第2回", range: [10, 20], desc: "問11〜20" },
  { label: "第3回", range: [20, 30], desc: "問21〜30" },
  { label: "第4回", range: [30, 40], desc: "問31〜40" },
  { label: "第5回", range: [40, 50], desc: "問41〜50" },
  { label: "第6回", range: [50, 60], desc: "問51〜60" },
  { label: "全問チャレンジ", range: [0, 60], desc: "問1〜60（全60問）" },
];

let state = {
  screen: "start",   // start | quiz | result
  selectedSection: null,
  questions: [],
  current: 0,
  selected: [],
  submitted: [],
};

function getKey(i) { return ["A","B","C","D"][i]; }

function updateHeaderScore() {
  const done = state.submitted.filter(s => s !== undefined).length;
  const correct = state.questions.reduce((acc, q, i) => {
    if (!state.submitted[i]) return acc;
    const ok = JSON.stringify([...state.submitted[i]].sort()) === JSON.stringify([...q.answer].sort());
    return acc + (ok ? 1 : 0);
  }, 0);
  document.getElementById("header-score").textContent =
    state.screen === "quiz" ? correct + " / " + done + " 正解" : "0 / 0";
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "start") renderStart(app);
  else if (state.screen === "quiz") renderQuiz(app);
  else if (state.screen === "result") renderResult(app);
  updateHeaderScore();
}

function renderStart(app) {
  let sectionBtns = SECTIONS.map((s, i) => `
    <button class="section-btn ${state.selectedSection === i ? "active" : ""}" onclick="selectSection(${i})">
      <div class="s-title">${s.label}</div>
      <div class="s-range">${s.desc}</div>
    </button>
  `).join("");

  app.innerHTML = `
    <div class="start-screen">
      <h1>MCコンサルタント<br>検定対策クイズ</h1>
      <p>Salesforce Marketing Cloud Engagement コンサルタント<br>資格試験の対策問題集です。</p>
      <div class="start-info">
        <div class="info-card"><div class="val">60</div><div class="lbl">総問題数</div></div>
        <div class="info-card"><div class="val">6</div><div class="lbl">セクション</div></div>
        <div class="info-card"><div class="val">67%</div><div class="lbl">合格ライン</div></div>
      </div>
      <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:10px;text-align:left;">セクションを選択</div>
      <div class="section-grid">${sectionBtns}</div>
      <button class="btn btn-primary btn-full" onclick="startQuiz()" ${state.selectedSection === null ? "disabled" : ""}>
        スタート →
      </button>
    </div>
  `;
}

function selectSection(i) {
  state.selectedSection = i;
  render();
}

function startQuiz() {
  const s = SECTIONS[state.selectedSection];
  state.questions = ALL_QUESTIONS.slice(s.range[0], s.range[1]);
  state.current = 0;
  state.selected = [];
  state.submitted = new Array(state.questions.length).fill(undefined);
  state.screen = "quiz";
  render();
}

function renderQuiz(app) {
  const q = state.questions[state.current];
  const isSubmitted = state.submitted[state.current] !== undefined;
  const pct = Math.round((state.current / state.questions.length) * 100);

  let optsHtml = q.opts.map((opt, i) => {
    let cls = "opt";
    if (isSubmitted) {
      const isCorrect = q.answer.includes(i);
      const wasSelected = (state.submitted[state.current] || []).includes(i);
      if (isCorrect && wasSelected) cls += " correct";
      else if (!isCorrect && wasSelected) cls += " wrong";
      else if (isCorrect && !wasSelected) cls += " missed";
    } else {
      if (state.selected.includes(i)) cls += " selected";
    }
    return `<button class="${cls}" onclick="toggleOpt(${i})" ${isSubmitted ? "disabled" : ""}>
      <span class="opt-key">${getKey(i)}.</span>
      <span class="opt-text">${opt}</span>
    </button>`;
  }).join("");

  let expHtml = isSubmitted ? `
    <div class="explanation">
      <div class="exp-label">解説</div>
      <div class="exp-text">${q.exp || "公式ドキュメントを参照してください。"}</div>
    </div>` : "";

  let navHtml = `
    <div class="nav-row">
      <button class="btn btn-secondary" onclick="prevQ()" ${state.current === 0 ? "disabled" : ""}>← 前へ</button>
      ${!isSubmitted
        ? `<button class="btn btn-primary" onclick="submitQ()" ${state.selected.length === 0 ? "disabled" : ""}>回答する</button>`
        : state.current < state.questions.length - 1
          ? `<button class="btn btn-primary" onclick="nextQ()">次の問題 →</button>`
          : `<button class="btn btn-primary" onclick="showResult()">結果を見る</button>`
      }
    </div>`;

  app.innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">
      <span>問 ${state.current + 1} / ${state.questions.length}</span>
      <span>${pct}% 完了</span>
    </div>
    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">問 ${q.no}</span>
        ${q.multi ? '<span class="q-multi">2つ選択</span>' : ""}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHtml}</div>
      ${expHtml}
    </div>
    ${navHtml}
  `;
}

function toggleOpt(i) {
  if (state.submitted[state.current] !== undefined) return;
  const q = state.questions[state.current];
  if (q.multi) {
    if (state.selected.includes(i)) state.selected = state.selected.filter(x => x !== i);
    else if (state.selected.length < q.answer.length) state.selected.push(i);
  } else {
    state.selected = [i];
  }
  render();
}

function submitQ() {
  state.submitted[state.current] = [...state.selected];
  render();
}

function nextQ() {
  state.current++;
  state.selected = state.submitted[state.current] ? [...state.submitted[state.current]] : [];
  render();
}

function prevQ() {
  if (state.current > 0) {
    state.current--;
    state.selected = state.submitted[state.current] ? [...state.submitted[state.current]] : [];
    render();
  }
}

function showResult() {
  state.screen = "result";
  render();
}

function renderResult(app) {
  const total = state.questions.length;
  let correct = 0;
  state.questions.forEach((q, i) => {
    const ans = state.submitted[i] || [];
    if (JSON.stringify([...ans].sort()) === JSON.stringify([...q.answer].sort())) correct++;
  });
  const pct = Math.round((correct / total) * 100);
  const scoreClass = pct >= 80 ? "great" : pct >= 67 ? "good" : "low";
  const msg = pct >= 80 ? "素晴らしい！合格圏内です 🎉" : pct >= 67 ? "合格ライン付近です。もう少し！" : "復習して再挑戦しましょう";

  let reviewHtml = state.questions.map((q, i) => {
    const ans = state.submitted[i] || [];
    const ok = JSON.stringify([...ans].sort()) === JSON.stringify([...q.answer].sort());
    const yourKeys = ans.map(x => getKey(x)).join(", ") || "未回答";
    const correctKeys = q.answer.map(x => getKey(x)).join(", ");
    return `
      <div class="review-item ${ok ? "ok" : "ng"}">
        <div class="review-q-text">問${q.no}. ${q.q.slice(0, 60)}…</div>
        <div class="review-answers">
          <span class="ans-tag ${ok ? "your-correct" : "your-wrong"}">あなた: ${yourKeys}</span>
          ${!ok ? `<span class="ans-tag correct-ans">正解: ${correctKeys}</span>` : ""}
        </div>
      </div>`;
  }).join("");

  app.innerHTML = `
    <div class="result-screen">
      <div class="result-score ${scoreClass}">${pct}<span style="font-size:28px">点</span></div>
      <div class="result-msg">${correct} / ${total} 問正解　${msg}</div>
      <div class="result-grid">
        <div class="result-card"><div class="rv rv-correct">${correct}</div><div class="rl">正解</div></div>
        <div class="result-card"><div class="rv rv-wrong">${total - correct}</div><div class="rl">不正解</div></div>
        <div class="result-card"><div class="rv rv-total">${total}</div><div class="rl">合計問題数</div></div>
      </div>
      <div class="review-title">問題ごとの結果</div>
      <div class="review-list">${reviewHtml}</div>
      <div class="result-btns">
        <button class="btn btn-secondary" onclick="retryQuiz()">同じセクションをやり直す</button>
        <button class="btn btn-primary" onclick="backToStart()">セクション選択に戻る</button>
      </div>
    </div>
  `;
}

function retryQuiz() {
  state.current = 0;
  state.selected = [];
  state.submitted = new Array(state.questions.length).fill(undefined);
  state.screen = "quiz";
  render();
}

function backToStart() {
  state.screen = "start";
  state.selectedSection = null;
  render();
}

render();
</script>
</body>
</html>
